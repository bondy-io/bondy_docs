<svg class="lr" xmlns="http://www.w3.org/2000/svg" width="1900" height="773.5" viewBox="0 0 1900 773.5"><style><![CDATA[
/* bondy.io palette. Tokens resolve when the page inlines this file (ZoomSvg);
   the fallbacks are the light theme, for the static image shown before
   hydration. */
svg.lr{--k-bg:var(--vp-c-bg,#f1efec);font-family:var(--f,Inter,system-ui,sans-serif);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
svg.lr .lr-h1{font-size:22px;font-weight:500;letter-spacing:-.02em;fill:var(--ink,#0b0b0c)}
svg.lr .lr-lede{font-size:13px;fill:var(--ink-2,#4a4a4e)}
svg.lr .lr-legend{font-family:var(--m,ui-monospace,monospace);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink-3,#656464)}
svg.lr .lr-section,svg.lr .lr-foot{font-family:var(--m,ui-monospace,monospace);letter-spacing:.08em;fill:var(--ink-3,#656464)}
svg.lr .lr-section{font-size:12px;text-transform:uppercase}
svg.lr .lr-foot{font-size:11px}
svg.lr .lr-lane-t{font-size:14.5px;font-weight:600;fill:var(--ink,#0b0b0c)}
svg.lr .lr-lane-s{font-family:var(--m,ui-monospace,monospace);font-size:10.5px;letter-spacing:.04em;fill:var(--ink-3,#656464)}
svg.lr .lr-card-t{font-size:14.5px;font-weight:500;fill:var(--ink,#0b0b0c)}
svg.lr .lr-card-t.k-reg,svg.lr .lr-card-t.k-rate{fill:var(--blue,#14705f)}
svg.lr .lr-card-t.k-none{fill:var(--ink-3,#656464)}
svg.lr .lr-body{font-size:12.5px;fill:var(--ink-2,#4a4a4e)}
svg.lr .lr-code{font-family:var(--m,ui-monospace,monospace);font-size:11px;fill:var(--ink-3,#656464);white-space:pre}
svg.lr .lr-frame{fill:none;stroke:var(--line-2,#dcd8d2);stroke-width:1.2}
svg.lr .lr-lane{fill:none;stroke:var(--line-2,#dcd8d2);stroke-width:1.2}
svg.lr .lr-card{fill:var(--paper-2,#e8e5e1);stroke:var(--line,#c9c5bf);stroke-width:1.3}
svg.lr .lr-card.k-reg{stroke:var(--blue,#14705f);stroke-width:1.6}
svg.lr .lr-card.k-rate{fill:color-mix(in srgb,var(--acc-l,#14705f) 16%,var(--k-bg));stroke:var(--blue,#14705f);stroke-width:1.6}
svg.lr .lr-card.k-none{fill:none;stroke:var(--ink-3,#656464);stroke-dasharray:6 4;opacity:.7}
svg.lr .lr-bar{fill:var(--line,#c9c5bf)}
svg.lr .lr-bar.k-conn,svg.lr .lr-bar.k-pool{fill:var(--ink-3,#656464)}
svg.lr .lr-bar.k-core{fill:var(--ink,#0b0b0c)}
svg.lr .lr-bar.k-reg,svg.lr .lr-bar.k-rate{fill:var(--blue,#14705f)}
svg.lr .lr-bar.k-none{fill:none}
svg.lr .lr-arrow{stroke:var(--ink-3,#656464);stroke-width:1.4}
svg.lr .lr-head{fill:var(--ink-3,#656464)}
]]></style><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="lr-head" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text class="lr-h1" x="44" y="44" text-anchor="start">Bondy — pools, worker queues and what happens when they fill</text><text class="lr-lede" x="44" y="69" text-anchor="start">Every bounded pool and queue on the request path: what feeds it, what bounds it, and whether overflow blocks, evicts or drops.</text><rect class="lr-card k-pool" x="44" y="87" width="16" height="14" rx="3.5"/><text class="lr-legend" x="67" y="99" text-anchor="start">Pool / worker queue</text><rect class="lr-card k-core" x="223.3" y="87" width="16" height="14" rx="3.5"/><text class="lr-legend" x="246.3" y="99" text-anchor="start">Summary</text><rect class="lr-frame" x="36" y="146" width="1828" height="571.5" rx="11"/><text class="lr-section" x="54" y="135" text-anchor="start">POOLS &amp; WORKER QUEUES</text><rect class="lr-card k-pool" x="42" y="168" width="436" height="222.5" rx="8"/><rect class="lr-bar k-pool" x="42" y="168" width="5" height="222.5" rx="2.5"/><text class="lr-card-t k-pool" x="59" y="193">Router pool  (sidejob)</text><text class="lr-body" x="59" y="215">Fed by: locally-originated WAMP routing.</text><text class="lr-body" x="59" y="232.5">Unordered — any worker may take any job.</text><text class="lr-body" x="59" y="250.0"></text><text class="lr-body" x="59" y="267.5">On overload the publish path logs and routes</text><text class="lr-body" x="59" y="285.0">SYNCHRONOUSLY, blocking the caller. It does</text><text class="lr-body" x="59" y="302.5">not drop the message.</text><text class="lr-code" x="59" y="326.0">router.pool.size      16</text><text class="lr-code" x="59" y="341.5">router.pool.capacity  2,000,000</text><text class="lr-code" x="59" y="357.0">router.pool.type      transient</text><rect class="lr-card k-pool" x="502" y="168" width="436" height="222.5" rx="8"/><rect class="lr-bar k-pool" x="502" y="168" width="5" height="222.5" rx="2.5"/><text class="lr-card-t k-pool" x="519" y="193">Flow pool  (bondy_router_worker)</text><text class="lr-body" x="519" y="215">Fed by: Partisan relay and bridge-relay</text><text class="lr-body" x="519" y="232.5">INGRESS ONLY — never local routing.</text><text class="lr-body" x="519" y="250.0"></text><text class="lr-body" x="519" y="267.5">Per-flow FIFO: one worker per flow key. Over</text><text class="lr-body" x="519" y="285.0">its share the message is SHED. It cannot spill</text><text class="lr-body" x="519" y="302.5">to another worker or run inline — either would</text><text class="lr-body" x="519" y="320.0">overtake the flow&#x27;s queued messages.</text><text class="lr-code" x="519" y="343.5">flow_pool.capacity 100,000 / router.pool.size</text><text class="lr-code" x="519" y="359.0">-&gt; bondy_wamp_dropped_total{shed, family}</text><rect class="lr-card k-pool" x="962" y="168" width="436" height="222.5" rx="8"/><rect class="lr-bar k-pool" x="962" y="168" width="5" height="222.5" rx="2.5"/><text class="lr-card-t k-pool" x="979" y="193">Session manager pool</text><text class="lr-body" x="979" y="215">Fed by: session open and close.</text><text class="lr-body" x="979" y="232.5"></text><text class="lr-body" x="979" y="250.0">Hashed gen_server pool owning session</text><text class="lr-body" x="979" y="267.5">lifecycle: store the session, monitor its</text><text class="lr-body" x="979" y="285.0">connection process, register per-session</text><text class="lr-body" x="979" y="302.5">procedures, close individually or in bulk.</text><text class="lr-code" x="979" y="326.0">session_manager.pool.size  32</text><rect class="lr-card k-pool" x="1422" y="168" width="436" height="222.5" rx="8"/><rect class="lr-bar k-pool" x="1422" y="168" width="5" height="222.5" rx="2.5"/><text class="lr-card-t k-pool" x="1439" y="193">Job manager pool + FIFO queues</text><text class="lr-body" x="1439" y="215">Fed by: meta events and WAMP event</text><text class="lr-body" x="1439" y="232.5">publication.</text><text class="lr-body" x="1439" y="250.0"></text><text class="lr-body" x="1439" y="267.5">One bounded passive FIFO per worker. Past</text><text class="lr-body" x="1439" y="285.0">the size bound the OLDEST entry is evicted;</text><text class="lr-body" x="1439" y="302.5">entries also expire on TTL.</text><text class="lr-code" x="1439" y="326.0">job_manager.pool.size   16</text><text class="lr-code" x="1439" y="341.5">job_manager.queue.size  160,000 (all queues)</text><text class="lr-code" x="1439" y="357.0">job_manager.queue.ttl   1m</text><rect class="lr-card k-pool" x="42" y="424.5" width="436" height="273.0" rx="8"/><rect class="lr-bar k-pool" x="42" y="424.5" width="5" height="273.0" rx="2.5"/><text class="lr-card-t k-pool" x="59" y="449.5">Registry partitions</text><text class="lr-body" x="59" y="471.5">Fed by: SUBSCRIBE / REGISTER and removals.</text><text class="lr-body" x="59" y="489.0"></text><text class="lr-body" x="59" y="506.5">Writes run in the CALLER&#x27;s process — no</text><text class="lr-body" x="59" y="524.0">serialisation point: exact indices via</text><text class="lr-body" x="59" y="541.5">concurrent ETS, prefix/wildcard via the</text><text class="lr-body" x="59" y="559.0">persistent ptrie&#x27;s path-copy + root CAS,</text><text class="lr-body" x="59" y="576.5">retrying on CAS loss. The partition process</text><text class="lr-body" x="59" y="594.0">owns the tables and the reclamation janitors.</text><text class="lr-body" x="59" y="611.5">Entries hash by realm URI to a partition.</text><text class="lr-code" x="59" y="635.0">registry.partitions       32</text><text class="lr-code" x="59" y="650.5">-&gt; bondy_registry_ptrie_cas_retries_total</text><text class="lr-code" x="59" y="666.0">db.registry.shard_count   (storage, separate)</text><rect class="lr-card k-pool" x="502" y="424.5" width="436" height="273.0" rx="8"/><rect class="lr-bar k-pool" x="502" y="424.5" width="5" height="273.0" rx="2.5"/><text class="lr-card-t k-pool" x="519" y="449.5">Transport queue</text><text class="lr-body" x="519" y="471.5">Fed by: HTTP long-poll and SSE transports,</text><text class="lr-body" x="519" y="489.0">which are not continuously connected.</text><text class="lr-body" x="519" y="506.5"></text><text class="lr-body" x="519" y="524.0">Bounded sharded ETS queue with three</text><text class="lr-body" x="519" y="541.5">independent bounds: message count, total</text><text class="lr-body" x="519" y="559.0">byte size, and a background TTL sweep.</text><text class="lr-code" x="519" y="582.5">http_transport.queue.max_messages / .max_bytes</text><text class="lr-code" x="519" y="598.0">  .message_ttl · .partitions · .eviction_interval</text><text class="lr-code" x="519" y="613.5">http_transport.idle_timeout (the session&#x27;s)</text><rect class="lr-card k-pool" x="962" y="424.5" width="436" height="273.0" rx="8"/><rect class="lr-bar k-pool" x="962" y="424.5" width="5" height="273.0" rx="2.5"/><text class="lr-card-t k-pool" x="979" y="449.5">Anti-entropy reactor pool</text><text class="lr-body" x="979" y="471.5">Fed by: anti-entropy syncs landing.</text><text class="lr-body" x="979" y="489.0"></text><text class="lr-body" x="979" y="506.5">Applies remote-merge reactions — session</text><text class="lr-body" x="979" y="524.0">close, RBAC cache invalidation, routing</text><text class="lr-body" x="979" y="541.5">summary updates. Sharded by cell key, so one</text><text class="lr-body" x="979" y="559.0">cell&#x27;s changes stay ordered on one worker.</text><text class="lr-code" x="979" y="582.5">aae_reactor.pool.size  16</text><rect class="lr-card k-core" x="1422" y="424.5" width="436" height="273.0" rx="8"/><rect class="lr-bar k-core" x="1422" y="424.5" width="5" height="273.0" rx="2.5"/><text class="lr-card-t k-core" x="1439" y="449.5">What happens when each one fills</text><text class="lr-body" x="1439" y="471.5">Only the flow pool loses messages outright:</text><text class="lr-code" x="1439" y="495.0">router pool      routes synchronously</text><text class="lr-code" x="1439" y="510.5">flow pool        drops (shed), counted</text><text class="lr-code" x="1439" y="526.0">job queue        evicts oldest, then TTL</text><text class="lr-code" x="1439" y="541.5">transport queue  per overflow_strategy</text><text class="lr-code" x="1439" y="557.0">registry parts   no queue; writers CAS-retry</text><text class="lr-code" x="1439" y="572.5">session manager  no bound; work queues</text><text class="lr-code" x="1439" y="588.0">aae reactor      no bound; work queues</text><text class="lr-foot" x="44" y="749.5" text-anchor="start">Verified against schema/bondy.schema and the modules named above.   Continues in: Ingress and admission.</text></svg>